name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fluentra, POSTGRES_PASSWORD: fluentra, POSTGRES_DB: fluentra_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluentra" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_MIGRATION_DATABASE_URL: postgres://fluentra:fluentra@localhost:5432/fluentra_test
      TEST_DATABASE_URL: postgres://fluentra_app:fluentra_app@localhost:5432/fluentra_test
      APP_DB_PASSWORD: fluentra_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://fluentra_app:fluentra_app@localhost:5432/fluentra_test
