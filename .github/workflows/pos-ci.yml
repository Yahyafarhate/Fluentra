name: POS CI
on:
  push: { paths: ["pos/**", ".github/workflows/pos-ci.yml"] }
  pull_request: { paths: ["pos/**", ".github/workflows/pos-ci.yml"] }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: pos } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fluentra, POSTGRES_PASSWORD: fluentra, POSTGRES_DB: comptoir_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluentra" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_MIGRATION_DATABASE_URL: postgres://fluentra:fluentra@localhost:5432/comptoir_test
      TEST_DATABASE_URL: postgres://comptoir_app:comptoir_app@localhost:5432/comptoir_test
      APP_DB_PASSWORD: comptoir_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: pos/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
