# Local infrastructure. `docker compose up -d db` is all you need for development.
#   docker compose --profile mail up -d   → also starts Mailpit (SMTP sink + web UI on http://localhost:8025)
#   docker compose --profile app up -d --build → runs the whole stack in containers (production-like)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluentra
      POSTGRES_PASSWORD: fluentra
      POSTGRES_DB: fluentra
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluentra -d fluentra"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    profiles: [mail]
    ports: ["1025:1025", "8025:8025"]
  app:
    build: .
    profiles: [app]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://fluentra_app:fluentra_app@db:5432/fluentra
      MIGRATION_DATABASE_URL: postgres://fluentra:fluentra@db:5432/fluentra
      APP_DB_PASSWORD: fluentra_app
      APP_URL: http://localhost:3000
      APP_SECRET: ${APP_SECRET:?set APP_SECRET (openssl rand -base64 48)}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      JOB_RUNNER_INLINE: "true"
      DEV_SIMULATE_NOTIFICATIONS: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
    ports: ["3000:3000"]
    command: sh -c "node_modules/.bin/tsx scripts/migrate.ts && node_modules/.bin/next start -H 0.0.0.0 -p 3000"
volumes:
  dbdata:
